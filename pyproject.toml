[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-personal-intelligence-platform"
version = "0.1.0"
description = "NOVA – Personal Intelligence Platform"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
ui = [
    "PySide6>=6.11,<6.12"
]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]